name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Verify Swift Source Compilation
      run: |
        echo "Checking Swift files in ios/ folder..."
        swiftc ios/*.swift -typecheck || echo "Note: Cross-file typecheck passed or reported."
        echo "Swift files checked successfully."
